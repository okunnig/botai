name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release (e.g. v0.1.0)"
        required: true
        type: string
      prerelease:
        description: "Mark release as pre-release (overrides tag auto-detection)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  verify-tag:
    name: Verify Tag
    runs-on: ubuntu-latest
    outputs:
      is_prerelease: ${{ steps.eval-prerelease.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate tag exists
        run: |
          if ! git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null; then
            echo "Error: Tag '${{ inputs.tag }}' does not exist in repository." >&2
            exit 1
          fi
          echo "Tag '${{ inputs.tag }}' verified."

      - name: Evaluate pre-release status
        id: eval-prerelease
        run: |
          IS_PRERELEASE="false"
          if [ "${{ inputs.prerelease }}" = "true" ] || [[ "${{ inputs.tag }}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Evaluated is_prerelease: $IS_PRERELEASE"

  build-release:
    name: Build Release (${{ matrix.target_os }}-${{ matrix.target_arch }})
    needs: [verify-tag]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_arch: x86_64
            archive_ext: tar.gz
            bin_name: botai
          - os: macos-latest
            target_os: macos
            target_arch: aarch64
            archive_ext: tar.gz
            bin_name: botai
          - os: windows-latest
            target_os: windows
            target_arch: x86_64
            archive_ext: zip
            bin_name: botai.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target_os }}-${{ matrix.target_arch }}

      - name: Build release binary
        run: cargo build --release

      - name: Package release archive (Unix)
        if: runner.os != 'Windows'
        run: |
          STAGE_DIR="staging"
          ARCHIVE_NAME="botai-${{ inputs.tag }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.${{ matrix.archive_ext }}"
          mkdir -p "$STAGE_DIR" dist
          cp "target/release/${{ matrix.bin_name }}" "$STAGE_DIR/"
          cp README.md LICENSE "$STAGE_DIR/"
          tar -czf "dist/$ARCHIVE_NAME" -C "$STAGE_DIR" .
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "$ARCHIVE_NAME" > "${ARCHIVE_NAME}.sha256"
          fi
          cat "${ARCHIVE_NAME}.sha256"

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $StageDir = "staging"
          $ArchiveName = "botai-${{ inputs.tag }}-${{ matrix.target_os }}-${{ matrix.target_arch }}.${{ matrix.archive_ext }}"
          New-Item -ItemType Directory -Force -Path $StageDir, "dist" | Out-Null
          Copy-Item "target/release/${{ matrix.bin_name }}" -Destination $StageDir
          Copy-Item "README.md" -Destination $StageDir
          Copy-Item "LICENSE" -Destination $StageDir
          Compress-Archive -Path "$StageDir/*" -DestinationPath "dist/$ArchiveName" -Force
          $Hash = (Get-FileHash -Path "dist/$ArchiveName" -Algorithm SHA256).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -FilePath "dist/$ArchiveName.sha256" -Encoding ascii
          Get-Content "dist/$ArchiveName.sha256"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts-${{ matrix.target_os }}-${{ matrix.target_arch }}
          path: dist/
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: [verify-tag, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-artifacts-*
          path: dist
          merge-multiple: true

      - name: Generate unified SHA256SUMS
        run: |
          cd dist
          shopt -s nullglob
          archives=(botai-*.tar.gz botai-*.zip)
          shopt -u nullglob
          if [ ${#archives[@]} -eq 0 ]; then
            echo "Error: No release archives found in dist" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          name: Release ${{ inputs.tag }}
          draft: false
          prerelease: ${{ needs.verify-tag.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
