[package]
name = "botai"
version = "0.1.0"
edition = "2021"
authors = ["botai team"]
description = "A cross-platform multi-repo workspace orchestrator and session multiplexer for AI agent workflows"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
directories = "5.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.29"
vt100 = "0.15"
notify-rust = "4.11"
tokio = { version = "1.38", features = ["full"] }

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
