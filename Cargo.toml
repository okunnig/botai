[package]
name = "botai"
version = "0.1.0"
edition = "2021"
authors = ["botai team"]
description = "A cross-platform multi-repo workspace orchestrator and session multiplexer for AI agent workflows"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
directories = "6.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.9"
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui = "0.30"
vt100 = "0.16"
notify-rust = "4.11"
tokio = { version = "1.38", features = ["full"] }

# Safe wrappers over the Windows console API. Already in the tree via crossterm;
# declared directly so the TUI can turn on ENABLE_VIRTUAL_TERMINAL_INPUT without
# `unsafe` (the crate is `#![forbid(unsafe_code)]`).
[target.'cfg(windows)'.dependencies]
crossterm_winapi = "0.9"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"
